name: 🔍 Secret & Credential Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    name: Scan for Leaked Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --verbose --redact

  check-sensitive-files:
    name: Check for Sensitive Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check sensitive files not committed
        run: |
          SENSITIVE_FILES=(
            "r2_config.json"
            "multi_server_config.json"
            "backend/r2_config.json"
            ".env"
            "frontend/.env.production"
            "namianime.keystore"
          )

          FOUND=false
          for file in "${SENSITIVE_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "❌ SENSITIVE FILE FOUND: $file"
              FOUND=true
            fi
          done

          if [ "$FOUND" = true ]; then
            echo ""
            echo "🚨 Sensitive files detected in the commit!"
            echo "These files contain credentials and must NEVER be committed."
            echo "Add them to .gitignore and remove from git history."
            exit 1
          else
            echo "✅ No sensitive files detected"
          fi

      - name: Check for hardcoded secrets patterns
        run: |
          # Check for common secret patterns in non-example files
          PATTERNS=(
            "secret_key.*:.*[a-f0-9]{40,}"
            "access_key.*:.*[A-Za-z0-9]{20,}"
            "api_token.*=.*[A-Za-z0-9]{30,}"
          )

          echo "Scanning for hardcoded secret patterns..."

          # Exclude example files and this workflow itself
          RESULT=$(grep -rE \
            --include="*.json" \
            --include="*.py" \
            --include="*.env" \
            --exclude="*.example.*" \
            --exclude-dir=".github" \
            --exclude-dir="node_modules" \
            --exclude-dir="venv" \
            -l "secret_key|access_key|SECRET_KEY|ACCESS_KEY" . 2>/dev/null || true)

          if [ -n "$RESULT" ]; then
            echo "⚠️  Files potentially containing secrets:"
            echo "$RESULT"
            echo ""
            echo "Please review these files carefully."
          else
            echo "✅ No obvious secret patterns found"
          fi
